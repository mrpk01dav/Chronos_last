name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir proj && unzip -q project.zip -d proj
          S=$(find proj -maxdepth 3 -name 'settings.gradle*' | head -1)
          echo "ROOT=$(dirname "$S")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain
        working-directory: ${{ env.ROOT }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.ROOT }}/**/build/outputs/apk/debug/*.apk
